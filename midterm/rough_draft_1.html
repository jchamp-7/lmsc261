<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);
    
    ctx.fillStyle = "#B6CE9F";
    ctx.fillRect(0, 0, w, h);

    ctx.arc(
        150,
        165,
        25,
        0,
        2 * Math.PI
    );

    ctx.fillStyle = "black";
    ctx.fill();

    ctx.arc(
        450,
        165,
        25,
        0,
        2 * Math.PI
    );
    
    ctx.fillStyle = "black";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        300,
        420,
        125,
        0,
        Math.PI,
        false
    );
    
    ctx.strokeStyle = "black";
    ctx.lineWidth = 8;
    ctx.stroke();

    ctx.beginPath();
    ctx.rect(
        287,
        295,
        20,
        15
    );
    
    
    ctx.strokeStyle = "black";
    ctx.lineWidth = 3;
    ctx.stroke();





    
    
    </script>
