<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

for(let c = 0; c < 256; c++){

    ctx.beginPath();
let xPos = Math.random() * w;
let yPos = Math.random() * h;
let radius = Math.random() * 15;

ctx.arc(xPos, yPos, radius, 0, Math.PI * 2, false);
ctx.fillStyle = "pink"; // color of circle
ctx.fill(); // render the circle

ctx.strokeStyle = "#2D1F26";
ctx.lineWidth = 6;
ctx.stroke(); // render the outline of the circle

}

</script>
